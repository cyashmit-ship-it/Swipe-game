<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12060a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Is It a Match?</title>
  <link rel="preload" href="fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rye.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>

2"/><circle cx="12" cy="123" r="2.4" fill="#c2410c"/><circle cx="12" cy="136" r="7" fill="#f28c1e"/><circle cx="12" cy="136" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="136" r="2.4" fill="#c2410c"/><circle cx="12" cy="149" r="7" fill="#f6b61e"/><circle cx="12" cy="149" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="149" r="2.4" fill="#c2410c"/><path d="M12 156c-5 4-6 10 0 16 6-6 5-12 0-16z" fill="#3f8f3a"/></symbol>
    <symbol id="i-garland-short" viewBox="0 0 24 122"><path d="M12 0V110" stroke="#7a4b12" stroke-width="1.2"/><circle cx="12" cy="6" r="7" fill="#f28c1e"/><circle cx="12" cy="6" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="6" r="2.4" fill="#c2410c"/><circle cx="12" cy="19" r="7" fill="#f6b61e"/><circle cx="12" cy="19" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="19" r="2.4" fill="#c2410c"/><circle cx="12" cy="32" r="7" fill="#f28c1e"/><circle cx="12" cy="32" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="32" r="2.4" fill="#c2410c"/><circle cx="12" cy="45" r="7" fill="#f6b61e"/><circle cx="12" cy="45" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="45" r="2.4" fill="#c2410c"/><circle cx="12" cy="58" r="7" fill="#f28c1e"/><circle cx="12" cy="58" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="58" r="2.4" fill="#c2410c"/><circle cx="12" cy="71" r="7" fill="#f6b61e"/><circle cx="12" cy="71" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="71" r="2.4" fill="#c2410c"/><circle cx="12" cy="84" r="7" fill="#f28c1e"/><circle cx="12" cy="84" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="84" r="2.4" fill="#c2410c"/><circle cx="12" cy="97" r="7" fill="#f6b61e"/><circle cx="12" cy="97" r="7" fill="none" stroke="#b5520a" stroke-width="1" stroke-dasharray="2 2"/><circle cx="12" cy="97" r="2.4" fill="#c2410c"/><path d="M12 104c-5 4-6 10 0 16 6-6 5-12 0-16z" fill="#3f8f3a"/></symbol>
    <symbol id="i-lantern" viewBox="0 0 60 150"><path d="M30 0v20" stroke="#f2b632" stroke-width="1.6"/><rect x="18" y="18" width="24" height="8" rx="2" fill="#f2b632"/><ellipse cx="30" cy="56" rx="27" ry="31" fill="#d92b33"/><path d="M30 25c-11 8-11 54 0 62M30 25c11 8 11 54 0 62M30 25c-21 6-21 56 0 62M30 25c21 6 21 56 0 62" fill="none" stroke="#8e1420" stroke-width="1.6"/><ellipse cx="21" cy="44" rx="5" ry="11" fill="#fff" opacity=".2"/><rect x="18" y="85" width="24" height="8" rx="2" fill="#f2b632"/><path d="M30 93v8" stroke="#f2b632" stroke-width="2"/><circle cx="30" cy="103" r="4" fill="#f2b632"/><path d="M25 106v38M30 106v42M35 106v38" stroke="#e2416e" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-medallion" viewBox="-30 -30 60 60"><g fill="#f2b632" stroke="#8a4b08" stroke-width="1.2"><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(0)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(45)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(90)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(135)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(180)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(225)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(270)"/><ellipse cx="0" cy="-17" rx="6.5" ry="11" transform="rotate(315)"/></g><g fill="#e2416e"><circle cx="0" cy="-24" r="2.2" transform="rotate(22)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(67)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(112)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(157)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(202)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(247)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(292)"/><circle cx="0" cy="-24" r="2.2" transform="rotate(337)"/></g><circle r="12" fill="#c62832" stroke="#8a4b08" stroke-width="1.2"/><circle r="7" fill="#1d6e73"/><circle r="3" fill="#f2b632"/></symbol>
    <symbol id="i-corner" viewBox="0 0 100 100"><path d="M0 100V2a98 98 0 0 1 98 98z" fill="#c62832"/><path d="M0 100V12a88 88 0 0 1 88 88" fill="none" stroke="#fff8ea" stroke-width="4.5" stroke-dasharray="0.1 9" stroke-linecap="round"/><path d="M0 100V24a76 76 0 0 1 76 76z" fill="#f2b632"/><path d="M0 100V38a62 62 0 0 1 62 62z" fill="#1d6e73"/><path d="M0 100V52a48 48 0 0 1 48 48" fill="none" stroke="#f2b632" stroke-width="3" stroke-dasharray="7 5"/><path d="M0 100V60a40 40 0 0 1 40 40z" fill="#e2416e"/><path d="M0 100V76a24 24 0 0 1 24 24z" fill="#fff8ea"/><circle cx="0" cy="100" r="12" fill="#2b1a14"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 11v6M12 7.2v.1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  </svg>

  <!-- Night poster background: sun rays, grain, marigold garland, lantern, vinyl, sparkles, truck-art corners -->
  <div class="deco" aria-hidden="true">
    <svg class="garland g-1"><use href="#i-garland-long"/></svg>
    <svg class="garland g-2"><use href="#i-garland-short"/></svg>
    <svg class="lantern"><use href="#i-lantern"/></svg>
    <svg class="vinyl"><use href="#i-vinyl"/></svg>
    <svg class="spark sp-1"><use href="#i-spark"/></svg>
    <svg class="spark sp-2"><use href="#i-spark"/></svg>
    <svg class="spark sp-3"><use href="#i-spark"/></svg>
    <svg class="spark sp-4"><use href="#i-spark"/></svg>
    <svg class="spark sp-5"><use href="#i-spark"/></svg>
    <svg class="corner corner-bl"><use href="#i-corner"/></svg>
    <svg class="corner corner-br"><use href="#i-corner"/></svg>
  </div>

  <div class="app">
    <header class="topbar">
      <button class="brand" id="brand" type="button" aria-label="Game logo">
        <img class="brand-logo" id="brandLogo" alt="" hidden>
        <svg class="brand-heart"><use href="#i-yes"/></svg><span data-text="title"></span>
      </button>
      <ol class="progress" id="progress" aria-label="Progress"></ol>
      <div class="topbar-end">
        <span class="sync" id="sync" data-state="saved" title="All saved" aria-hidden="true"></span>
        <button class="btn-quiet" id="exitBtn" type="button">Exit</button>
      </div>
    </header>

    <main>
      <!-- Start -->
      <section class="screen screen-start" id="screen-start" aria-labelledby="startTitle">
        <div class="start-hero">
          <img class="start-logo" id="startLogo" alt="" hidden>
          <p class="presenter"><span class="presenter-name" data-text="presenter"></span><span class="presenter-sub" data-text="presents"></span></p>
          <h1 id="startTitle" data-text="title"></h1>
          <p class="intro" data-text="intro"></p>
          <ul class="start-how" id="startHow"></ul>
          <div class="fan" id="fan"></div>
        </div>
        <form class="start-form" id="startForm" novalidate>
          <svg class="medal" aria-hidden="true"><use href="#i-medallion"/></svg>
          <h2 data-text="startHeading"></h2>
          <label class="field">
            <span data-text="tokenLabel"></span>
            <input id="token" name="token" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" maxlength="9" required>
            <small data-text="tokenHelp"></small>
          </label>
          <label class="field">
            <span data-text="ageLabel"></span>
            <input id="age" name="age" type="number" inputmode="numeric" min="5" max="99" required>
          </label>
          <fieldset class="field">
            <legend data-text="genderLabel"></legend>
            <div class="chips-choice">
              <label><input type="radio" name="gender" value="Male" required><span>Male</span></label>
              <label><input type="radio" name="gender" value="Female"><span>Female</span></label>
              <label><input type="radio" name="gender" value="Other"><span>Other</span></label>
              <label><input type="radio" name="gender" value="Prefer not to say"><span>Prefer not to say</span></label>
            </div>
          </fieldset>
          <p class="form-error" id="formError" role="alert" hidden></p>
          <button class="btn-primary btn-big" id="startBtn" type="submit"><span data-text="startButton"></span></button>
        </form>
      </section>

      <!-- Play -->
      <section class="screen screen-play" id="screen-play">
        <div class="prompt">
          <p class="round-tag" id="roundTag"></p>
          <h2 id="question"></h2>
          <ul class="legend">
            <li class="legend-yes"><svg><use href="#i-yes"/></svg><span id="yesMeans"></span></li>
            <li class="legend-no"><svg><use href="#i-no"/></svg><span id="noMeans"></span></li>
            <li class="legend-crush" id="crushLegend"><svg><use href="#i-crush"/></svg><span id="crushMeans"></span></li>
          </ul>
          <p class="counter" id="counter"></p>
          <ul class="keys" aria-label="Keyboard shortcuts">
            <li><kbd>←</kbd> No</li>
            <li><kbd>→</kbd> Yes</li>
            <li class="key-crush"><kbd>↑</kbd> Desi Crush</li>
            <li><kbd>⌫</kbd> Undo</li>
          </ul>
        </div>
        <div class="deck-area">
          <div class="deck" id="deck"></div>
          <div class="controls">
            <button class="ctl ctl-undo" id="undoBtn" type="button"><svg><use href="#i-undo"/></svg><span data-btn="undo"></span></button>
            <button class="ctl ctl-no" id="noBtn" type="button"><svg><use href="#i-no"/></svg><span data-btn="no"></span></button>
            <button class="ctl ctl-crush" id="crushBtn" type="button"><svg><use href="#i-crush"/></svg><span data-btn="crush"></span><b class="crush-count" id="crushCount">1</b></button>
            <button class="ctl ctl-yes" id="yesBtn" type="button"><svg><use href="#i-yes"/></svg><span data-btn="yes"></span></button>
          </div>
        </div>
      </section>

      <!-- Done -->
      <section class="screen screen-done" id="screen-done" aria-labelledby="profileName">
        <div class="profile-card">
          <svg class="medal" aria-hidden="true"><use href="#i-medallion"/></svg>
          <p class="profile-kicker" id="doneKicker"></p>
          <h2 id="profileName"></h2>
          <p id="profileLine"></p>
          <div class="match" aria-live="polite">
            <div class="match-photo-wrap" id="matchPhoto"></div>
            <div class="match-text">
              <p class="match-kicker"><svg><use href="#i-yes"/></svg><span id="matchKicker"></span></p>
              <p class="match-name" id="matchName"></p>
              <p class="match-line" id="matchLine"></p>
            </div>
          </div>
          <dl class="stats" id="stats"></dl>
          <button class="btn-primary btn-big" id="nextPlayerBtn" type="button"></button>
        </div>
        <ul class="tiles" id="tiles" aria-label="Your answers"></ul>
      </section>
    </main>
  </div>

  <!-- Round switch flash -->
  <div class="flash" id="flash" hidden aria-live="polite">
    <svg class="flash-spark fs-1" aria-hidden="true"><use href="#i-spark"/></svg>
    <svg class="flash-spark fs-2" aria-hidden="true"><use href="#i-spark"/></svg>
    <svg class="flash-spark fs-3" aria-hidden="true"><use href="#i-spark"/></svg>
    <p class="flash-emoji" id="flashEmoji"></p>
    <p class="flash-title" id="flashTitle"></p>
    <p class="flash-text" id="flashText"></p>
    <p class="flash-crush" id="flashCrush" hidden></p>
  </div>

  <!-- Match screen after Yes (moves on by itself) or Desi Crush (waits for Next). No has no screen. -->
  <div class="overlay" id="result" hidden>
    <div class="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="plates" id="plates"></div>
      <p class="result-name" id="resultName"></p>
      <p class="result-line" id="resultLine"></p>
      <ul class="teasers" id="teasers"></ul>
      <div class="result-actions">
        <button class="btn-primary btn-big" id="nextBtn" type="button"></button>
        <button class="btn-quiet" id="changeBtn" type="button"><svg><use href="#i-undo"/></svg><span id="changeText"></span></button>
      </div>
      <div class="timer" id="timer" aria-hidden="true"><span></span></div>
      <p class="tap-hint-result" id="tapHint"></p>
    </div>
    <div class="burst" id="burst" aria-hidden="true"></div>
  </div>

  <!-- Full dish profile -->
  <div class="overlay overlay-dim" id="profile" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pName">
      <div class="sheet-photos" id="pPhotos"></div>
      <div class="sheet-body">
        <h2 id="pName"></h2>
        <p class="from"><svg><use href="#i-pin"/></svg><span id="pFrom"></span></p>
        <p id="pBio"></p>
        <dl class="sheet-facts" id="pFacts"></dl>
        <button class="btn-primary" id="pBack" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Halftime fortune cookie -->
  <div class="overlay" id="halftime" hidden>
    <div class="half" role="dialog" aria-modal="true" aria-labelledby="halfTitle">
      <h2 id="halfTitle"></h2>
      <p id="halfText"></p>
      <button class="cookie" id="cookie" type="button" aria-label="Crack the fortune cookie">
        <span class="cookie-half cookie-l">🥠</span><span class="cookie-half cookie-r">🥠</span>
      </button>
      <p class="fortune" id="fortune" hidden></p>
      <button class="btn-primary btn-big" id="halfBtn" type="button"></button>
    </div>
    <div class="burst" id="halfBurst" aria-hidden="true"></div>
  </div>

  <!-- Move Desi Crush -->
  <div class="overlay overlay-dim" id="moveDialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="moveTitle">
      <h2 id="moveTitle"></h2>
      <p id="moveText"></p>
      <div class="dialog-actions">
        <button class="btn-quiet" id="moveKeep" type="button"></button>
        <button class="btn-primary btn-crush" id="moveYes" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Confirm exit -->
  <div class="overlay overlay-dim" id="exitDialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
      <h2 id="exitTitle"></h2>
      <p id="exitText"></p>
      <div class="dialog-actions">
        <button class="btn-quiet" id="exitCancel" type="button"></button>
        <button class="btn-primary" id="exitConfirm" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Team panel: opens when the logo is tapped 5 times -->
  <div class="overlay overlay-dim" id="team" hidden>
    <div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="teamTitle">
      <h2 id="teamTitle">Team tools</h2>
      <form id="teamForm" class="team-grid" novalidate>
        <label class="field"><span>Your name</span><input id="tName" autocomplete="off" maxlength="40"></label>
        <label class="field"><span>Stall PIN</span><input id="tPin" type="password" autocomplete="off" maxlength="40"></label>
        <label class="field"><span>Token</span><input id="tToken" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="9"></label>
        <button class="btn-primary" id="tCheck" type="submit">Check token</button>
      </form>
      <div id="tResult" class="team-result" role="status"></div>
      <div id="tActions" class="team-actions" hidden>
        <label class="field"><span>Reason (saved in the sheet)</span><input id="tReason" maxlength="200" placeholder="For example: phone battery died mid-game"></label>
        <div class="dialog-actions">
          <button class="btn-primary" id="tReplay" type="button" hidden>Allow a replay</button>
          <button class="btn-primary" id="tRestart" type="button" hidden>Restart unfinished game</button>
        </div>
      </div>
      <div class="team-device">
        <p>This device: <span id="tDevice"></span>. Saving: <span id="tQueue"></span></p>
        <div class="dialog-actions">
          <button class="btn-quiet" id="tReload" type="button">Reload page</button>
          <button class="btn-quiet" id="tClose" type="button">Close</button>
        </div>
      </div>
    </div>
  </div>

  <p class="toast" id="toast" role="status" hidden></p>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
